[pytest]
testpaths = tests

# O diretorio temporario padrao do pytest (%LOCALAPPDATA%\Temp\pytest-of-<usuario>)
# fica inacessivel neste ambiente Windows e derruba no setup todo teste que usa
# tmp_path. Mantendo basetemp e cache dentro do proprio projeto os testes rodam
# sem depender das permissoes do Temp do sistema.
addopts = --basetemp=tmp/pytest
cache_dir = tmp/pytest_cache
