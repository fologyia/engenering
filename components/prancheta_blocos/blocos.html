<div class="mf">
  <aside class="biblioteca" data-biblioteca aria-label="Biblioteca de blocos">
    <div class="bib-cabeca"><span class="bib-rot">Biblioteca</span><span class="bib-conta" data-conta></span></div>
    <div class="bib-titulo">Inserir no fluxo</div>
    <input type="search" data-busca placeholder="Buscar bloco..." aria-label="Buscar bloco" />
    <p class="bib-ajuda" data-ajuda></p>
    <div class="lista" data-lista></div>
  </aside>
  <div class="miolo">
    <div class="topo-barra">
      <span class="luz falta" data-luz></span>
      <div class="situacao-texto">
        <strong data-titulo>Monte os blocos</strong>
        <span data-detalhe></span>
      </div>
      <div class="acoes">
        <button type="button" class="forte" data-a="agrupar" hidden title="Junta os blocos marcados num conjunto">Agrupar</button>
        <button type="button" class="icone" data-a="duplicar" disabled title="Duplicar: copia o bloco com os mesmos números, logo abaixo (Ctrl+C e Ctrl+V)" aria-label="Duplicar o bloco"><svg class="desenho-do-botao" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.6"/><path d="M3 10.5V3.6A1.6 1.6 0 0 1 4.6 2h6.9"/></svg></button>
        <button type="button" class="icone" data-a="desfazer" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">↶</button>
        <button type="button" class="icone" data-a="refazer" title="Refazer (Ctrl+Y)" aria-label="Refazer">↷</button>
        <button type="button" class="forte" data-a="organizar" title="Alinha os blocos da esquerda para a direita">Organizar</button>
      </div>
    </div>
    <nav class="trilha" data-trilha aria-label="Onde você está" hidden></nav>
    <svg tabindex="0" role="application" aria-label="Prancheta de blocos da fórmula"></svg>
    <div class="rodape">
      <div class="dica" data-dica></div>
      <div class="zoom">
        <button type="button" data-a="biblioteca" title="Mostra ou esconde a biblioteca">Biblioteca</button>
        <button type="button" data-a="menos" title="Afastar" aria-label="Afastar">−</button>
        <span data-zoom>100%</span>
        <button type="button" data-a="mais" title="Aproximar" aria-label="Aproximar">+</button>
        <button type="button" class="ajuste" data-a="ver" title="Mostra todos os blocos">Ajustar à tela</button>
      </div>
    </div>
  </div>
</div>
