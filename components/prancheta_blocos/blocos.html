<div class="mf">
  <div class="paleta" data-paleta></div>
  <div class="barra">
    <div class="bloco">
      <button type="button" data-a="desfazer" title="Desfazer (Ctrl+Z)">↶</button>
      <button type="button" data-a="refazer" title="Refazer (Ctrl+Y)">↷</button>
    </div>
    <div class="bloco">
      <button type="button" data-a="menos" title="Afastar">−</button>
      <button type="button" data-a="mais" title="Aproximar">+</button>
      <button type="button" data-a="ver" title="Mostra todos os blocos">Ver tudo</button>
      <button type="button" data-a="organizar" title="Alinha os blocos da esquerda para a direita">Organizar</button>
    </div>
    <span class="dica" data-dica></span>
  </div>
  <svg tabindex="0" role="application" aria-label="Prancheta de blocos da fórmula"></svg>
</div>
