<div class="an">
  <div class="topo">
    <button type="button" data-a="tocar" class="tocar" title="Tocar ou pausar (barra de espaço)">▶ Tocar</button>
    <button type="button" data-a="inicio" title="Voltar ao começo">⏮</button>
    <input type="range" data-c="quadro" min="0" max="0" step="1" value="0" aria-label="Instante mostrado" />
    <span class="tempo" data-i="tempo">t = 0</span>
    <label class="vel" title="Quanto tempo a animação leva: em 1× o tempo inteiro passa em 10 segundos">
      Velocidade
      <select data-c="velocidade">
        <option value="0.25">0,25×</option>
        <option value="0.5">0,5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </label>
  </div>
  <div class="vista">
    <canvas data-v="cena" tabindex="0" aria-label="Animação no tempo"></canvas>
    <div class="dica" data-i="dica" hidden></div>
  </div>
  <div class="escalas" data-i="escalas"></div>
  <div class="graficos" data-i="graficos"></div>
  <div class="nota" data-i="nota"></div>
</div>
