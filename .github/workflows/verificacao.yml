name: Verificação

# Roda a cada push e a cada pull request. O objetivo é que a suíte de testes
# deixe de depender de alguém lembrar de executá-la antes de subir código.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Verificação de tipos (mypy)
        run: mypy

      - name: Testes
        run: pytest -q
